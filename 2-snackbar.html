<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/vendor-CUZofXIC.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/styles-D-e2mGcy.css">
  </head>
  <body>
    <header class="header">
      <div class="container">
        <nav class="nav">
          <a class="nav-logo" href="./index.html" aria-label="Site logo">
            <svg class="nav-logo-icon" width="100" height="30">
              <use href="/goit-js-hw-10/assets/sprite-C6bbaCzQ.svg#logo"></use>
            </svg>
          </a>
          <ul class="nav-list">
            <li class="nav-item">
              <a class="nav-link" href="./index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./1-timer.html">Timer</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./2-snackbar.html">Snackbar</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        <form class="form">
          <label class="delay-wrapper">
            Delay (ms)
            <input
              class="input delay-input"
              type="number"
              name="delay"
              required
            />
          </label>

          <fieldset class="state">
            <legend class="state-title">State</legend>
            <label class="state-input-wrapper">
              <input
                class="state-input"
                type="radio"
                name="state"
                value="fulfilled"
                required
              />
              Fulfilled
            </label>
            <label class="state-input-wrapper">
              <input
                class="state-input"
                type="radio"
                name="state"
                value="rejected"
                required
              />
              Rejected
            </label>
          </fieldset>

          <button class="btn snackbar-btn" type="submit">
            Create notification
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
